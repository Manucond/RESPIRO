  <path d="M76 84 q7 7 14 0" fill="none" stroke="#FFF1BF" stroke-width="5" stroke-linecap="round"/><path d="M110 84 q7 7 14 0" fill="none" stroke="#FFF1BF" stroke-width="5" stroke-linecap="round"/><ellipse cx="100" cy="103" rx="5" ry="4" fill="#FFF1BF"/>
