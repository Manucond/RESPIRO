  <rect x="27" y="70" width="17" height="34" rx="7" fill="#E3A92B" stroke="#16213E" stroke-width="5"/>
  <rect x="156" y="70" width="17" height="34" rx="7" fill="#E3A92B" stroke="#16213E" stroke-width="5"/>
